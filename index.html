<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Livros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>📚 Buscador de Livros</h1>
    <p>Digite o título de um livro e veja os detalhes</p>
  </header>

  <main>
    <div class="busca">
      <input type="text" id="campo-busca" placeholder="Ex: Harry Potter">
      <button id="botao-buscar">Buscar</button>
    </div>

    <div id="resultado"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
